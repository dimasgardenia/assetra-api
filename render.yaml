# Render Blueprint — one web service that runs the API and serves the
# built frontend from the same origin. Deploy from a phone:
#   Render dashboard → New → Blueprint → pick dimasgardenia/assetra-api →
#   pick this branch → Apply. The URL is https://<service-name>.onrender.com
#
# Production notes: the "starter" plan + a persistent disk keeps the SQLite DB
# and uploaded photos across deploys/restarts (the free plan wipes them on every
# deploy and sleeps after 15 min idle). The start command only creates the admin
# account (ADMIN_EMAIL / ADMIN_PASSWORD); no demo data is seeded in production.
services:
  - type: web
    name: assetra
    runtime: node
    plan: starter
    disk:
      name: assetra-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: npm ci && bash scripts/build-web.sh
    startCommand: node src/db/seed.js && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: WEB_DIST
        value: ./web-dist
      # Google Sign-In (OAuth client ID bukan rahasia; dipakai backend & disematkan ke bundel frontend saat build)
      - key: GOOGLE_CLIENT_ID
        value: 913829727818-1kcfri271ngm2hmrko9qucsnbi0jnkhg.apps.googleusercontent.com
      - key: VITE_GOOGLE_CLIENT_ID
        value: 913829727818-1kcfri271ngm2hmrko9qucsnbi0jnkhg.apps.googleusercontent.com
      # Google Maps: isi lewat dashboard hosting (sync: false = tidak disimpan di repo)
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      # Email transaksional: isi lewat dashboard hosting
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Assetra <no-reply@assetraland.com>
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/assetra.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # Akun admin pertama (dibuat sekali saat boot pertama). Isi lewat dashboard hosting.
      - key: ADMIN_EMAIL
        value: landassetra@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      # Same origin — CORS only matters when the frontend is hosted elsewhere.
      - key: CORS_ORIGIN
        value: http://localhost:5173
      - key: APP_URL
        fromService:
          type: web
          name: assetra
          envVarKey: RENDER_EXTERNAL_URL
